name: Build Khadamati APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and unpack Khadamati project
        shell: bash
        run: |
          set -e
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)
          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP file found in repository root."
            ls -la
            exit 1
          fi
          echo "Using ZIP: $ZIP"
          rm -rf _khadamati_build
          mkdir _khadamati_build
          unzip -q "$ZIP" -d _khadamati_build
          PROJECT=$(find _khadamati_build -type f -name settings.gradle -print -quit | xargs -r dirname)
          if [ -z "$PROJECT" ]; then
            echo "ERROR: settings.gradle not found inside ZIP."
            find _khadamati_build -maxdepth 4 -type f | head -100
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Project: $PROJECT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: khadamati-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
