name: Build Khadamati APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and unpack Khadamati project
        shell: bash
        run: |
          set -e
          ZIP="$(find . -type f -iname '*.zip' -not -path './.git/*' | head -n 1)"
          if [ -z "$ZIP" ]; then
            echo "No project ZIP found."
            exit 1
          fi
          echo "Using ZIP: $ZIP"
          mkdir -p _khadamati_project
          unzip -q "$ZIP" -d _khadamati_project

          GRADLEW="$(find "$GITHUB_WORKSPACE/_khadamati_project" -type f -name gradlew | head -n 1)"
          if [ -z "$GRADLEW" ]; then
            echo "gradlew was not found after extracting the project."
            find "$GITHUB_WORKSPACE/_khadamati_project" -maxdepth 3 -type f | head -n 100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Make Gradle executable
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Show APK files
        run: |
          find "$PROJECT_DIR/app/build/outputs/apk" -type f -name '*.apk' -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: khadamati-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
