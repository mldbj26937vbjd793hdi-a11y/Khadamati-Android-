name: Build Khadamati APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Find and unpack Khadamati Android project
        shell: bash
        run: |
          set -e
          ZIP="$(find . -type f -iname '*.zip' -not -path './.git/*' | grep -E 'khadamati_android_(project|github_actions|project_v2).*\.zip$' | head -n 1)"
          if [ -z "$ZIP" ]; then
            echo "Khadamati Android ZIP not found. ZIP files present:"
            find . -type f -iname '*.zip' -not -path './.git/*' -print
            exit 1
          fi
          echo "Using: $ZIP"
          rm -rf _khadamati_project
          mkdir _khadamati_project
          unzip -q "$ZIP" -d _khadamati_project

          SETTINGS="$(find "$GITHUB_WORKSPACE/_khadamati_project" -type f -name settings.gradle | head -n 1)"
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle not found after extraction."
            find "$GITHUB_WORKSPACE/_khadamati_project" -maxdepth 5 -type f | sort | head -n 200
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Set up Gradle 8.10.2
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.10.2'

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Show APK files
        run: find "$PROJECT_DIR/app/build/outputs/apk" -type f -name '*.apk' -print

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: khadamati-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
